<!DOCTYPE html>

    <title>Bio-Fix | Sistema Integral Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .card-shadow { box-shadow: 0 4px 25px -5px rgba(0,0,0,0.05); }
        .hidden { display: none; }
        .btn-choice { @apply w-full py-8 rounded-[32px] font-black uppercase text-xs tracking-widest shadow-lg transition-all active:scale-[0.97] flex flex-col items-center justify-center gap-3 border-2; }
        .input-premium { @apply w-full p-5 bg-slate-50 border-2 border-transparent rounded-2xl outline-none focus:border-blue-500 focus:bg-white font-bold text-slate-700 transition-all uppercase placeholder:normal-case; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-open .accordion-content { max-height: 10000px; transition: max-height 0.5s ease-in; }
        .rotate-icon { transition: transform 0.3s; }
        .accordion-open .rotate-icon { transform: rotate(45deg); }
        .bg-exocad { background-color: #6d28d9; }
        .bg-mu-yellow { background-color: #facc15; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-xl mx-auto min-h-screen flex flex-col relative">
        <header class="bg-slate-900 text-white p-10 pt-14 rounded-b-[50px] shadow-2xl text-center">
            <h1 class="text-4xl font-black italic">BIO-FIX<span class="text-blue-500">®</span></h1>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.5em] mt-3">Professional Implant Systems</p>
        </header>

        <nav class="glass sticky top-4 mx-6 mt-[-25px] p-4 rounded-[24px] shadow-xl z-50 flex justify-between items-center border border-white/40">
            <button id="btn-volver" onclick="goBack()" class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-xl font-black hidden">←</button>
            <div class="flex flex-col ml-2">
                <span id="nav-title" class="text-[9px] font-black uppercase text-blue-500 italic">Bio-Fix Portal</span>
                <span id="nav-subtitle" class="text-sm font-black text-slate-900 uppercase">Catálogo</span>
            </div>
            <button onclick="goToResumen()" class="bg-slate-900 text-white px-5 py-3 rounded-xl font-black text-[10px] uppercase shadow-lg">
                Pedido (<span id="cart-count">0</span>)
            </button>
        </nav>

        <main class="p-6 mt-6 flex-grow">
            <section id="step-menu" class="space-y-4">
                <button onclick="openSub('sub-implantes')" class="btn-choice bg-white border-slate-100 text-slate-900 flex-row !py-6 !justify-start px-8">📦 Implantes</button>
                <button onclick="openSub('sub-analogicos')" class="btn-choice bg-white border-slate-100 text-slate-900 flex-row !py-6 !justify-start px-8">🔩 Componentes Analógicos</button>
                <button onclick="loadProducts('analogicos', 'mu_pro')" class="btn-choice bg-mu-yellow text-slate-900 flex-row !py-6 !justify-start px-8">🟡 Componentes MU Pro</button>
                <button onclick="loadProducts('digital', 'exocad')" class="btn-choice bg-exocad text-white flex-row !py-6 !justify-start px-8">🖥️ Flujo Digital</button>
            </section>

            <section id="sub-implantes" class="hidden grid grid-cols-2 gap-4">
                <button onclick="loadProducts('implantes', 'monopieza')" class="btn-choice bg-white border-slate-100">MP</button>
                <button onclick="loadProducts('implantes', 'basales')" class="btn-choice bg-white border-slate-100">Basales</button>
                <button onclick="loadProducts('implantes', 'compresivos')" class="btn-choice bg-white border-slate-100">Compresivos</button>
                <button onclick="loadProducts('implantes', 'hi')" class="btn-choice bg-white border-slate-100">HI</button>
                <button onclick="loadProducts('implantes', 'he')" class="btn-choice bg-white border-slate-100">HE</button>
                <button onclick="loadProducts('implantes', 'cmhi')" class="btn-choice bg-white border-slate-100">CM</button>
                <button onclick="loadProducts('implantes', 'mu')" class="btn-choice bg-mu-yellow border-mu-yellow text-slate-900">Pilares MU</button>
            </section>

            <section id="sub-analogicos" class="hidden grid grid-cols-2 gap-4">
                <button onclick="loadProducts('analogicos', 'mp')" class="btn-choice bg-white border-slate-100">MP</button>
                <button onclick="loadProducts('analogicos', 'cmu')" class="btn-choice bg-white border-slate-100">CMU</button>
                <button onclick="loadProducts('analogicos', 'hi')" class="btn-choice bg-white border-slate-100">HI</button>
                <button onclick="loadProducts('analogicos', 'he')" class="btn-choice bg-white border-slate-100">HE</button>
                <button onclick="loadProducts('analogicos', 'cm')" class="btn-choice bg-white border-slate-100">CM</button>
            </section>

            <section id="step-lista" class="hidden space-y-4"></section>
            <section id="step-resumen" class="hidden space-y-5"></section>
        </main>
    </div>

        let cart = {}; let stack = ['step-menu'];

        function showSection(id, push = true) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(push) stack.push(id);
            document.getElementById('btn-volver').classList.toggle('hidden', stack.length <= 1);
            window.scrollTo(0,0);
        }

        function goBack() { if(stack.length > 1) { stack.pop(); showSection(stack.pop()); } }
        function openSub(id) { showSection(id); }

        function loadProducts(cat, subcat) {
            showSection('step-lista');
            const container = document.getElementById('step-lista');
            container.innerHTML = "";
            const data = DB[cat][subcat];
            for (const group in data) {
                const groupDiv = document.createElement('div');
                groupDiv.className = "bg-white rounded-[32px] overflow-hidden card-shadow mb-4";
                let html = `<button onclick="this.parentElement.classList.toggle('accordion-open')" class="w-full flex justify-between items-center p-6 bg-slate-900 text-white font-black text-[10px] uppercase">
                    <span>${group}</span><span class="text-xl rotate-icon">+</span></button><div class="accordion-content divide-y">`;
                data[group].forEach(item => {
                    const q = cart[item] || 0;
                    html += `<div class="flex justify-between items-center p-6"><span class="text-[10px] font-black text-slate-600 uppercase pr-4">${item}</span>
                        <div class="flex items-center gap-3 bg-slate-100 p-1 rounded-2xl">
                            <button onclick="update('${item}',-1,this)" class="w-10 h-10 bg-white rounded-xl shadow font-bold">-</button>
                            <span class="font-black text-sm w-4 text-center">${q}</span>
                            <button onclick="update('${item}',1,this)" class="w-10 h-10 bg-slate-900 text-white rounded-xl shadow font-bold">+</button>
                        </div></div>`;
                });
                groupDiv.innerHTML = html + "</div>";
                container.appendChild(groupDiv);
            }
        }

        function update(item, delta, btn) {
            cart[item] = (cart[item] || 0) + delta;
            if(cart[item] <= 0) delete cart[item];
            btn.parentElement.querySelector('span').innerText = cart[item] || 0;
            document.getElementById('cart-count').innerText = Object.values(cart).reduce((a,b)=>a+b, 0);
        }

        function goToResumen() {
            showSection('step-resumen');
            const container = document.getElementById('step-resumen');
            container.innerHTML = `<h2 class="font-black uppercase text-center mb-6">Resumen de Pedido</h2>`;
            Object.entries(cart).forEach(([n, q]) => {
                container.innerHTML += `<div class="p-6 bg-white rounded-3xl mb-2 flex justify-between border"><span>${n}</span><b>x${q}</b></div>`;
            });
            container.innerHTML += `<button onclick="sendWA()" class="w-full bg-green-600 text-white py-6 rounded-3xl mt-6 font-black uppercase">Enviar Pedido</button>`;
        }

        function sendWA() {
            let m = `*PEDIDO BIO-FIX®*\n\n`;
            Object.entries(cart).forEach(([n,q])=> m+=`✅ ${q} x ${n}\n`);
            window.open(`https://wa.me/5491122334455?text=${encodeURIComponent(m)}`);
        }
    </script>
</body>
</html>
