<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Fix | Sistema de Pedidos Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-cian { background-color: #00FFFF; color: #000; }
        .bg-rojo { background-color: #FF0000; color: #fff; }
        .bg-verde { background-color: #008000; color: #fff; }
        .bg-violeta { background-color: #8A2BE2; color: #fff; }
        .bg-gris { background-color: #808080; color: #fff; }
        .bg-fucsia { background-color: #FF00FF; color: #fff; }
        .hidden { display: none; }
        .active-tab { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: 800; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <div class="max-w-xl mx-auto bg-white min-h-screen shadow-2xl flex flex-col">
        <header class="bg-slate-900 text-white p-5 text-center">
            <h1 class="text-2xl font-black tracking-tighter uppercase italic">BIO-FIX®</h1>
            <p class="text-[10px] text-blue-400 font-bold uppercase tracking-[0.3em]">Catálogo Oficial de Implantes</p>
        </header>

        <nav class="flex border-b sticky top-0 bg-white z-50 shadow-sm">
            <button onclick="showSection('step-cliente')" id="nav-cliente" class="flex-1 py-4 text-[10px] font-black active-tab uppercase">1. Profesional</button>
            <button onclick="validateAndGo()" id="nav-productos" class="flex-1 py-4 text-[10px] font-black uppercase opacity-40">2. Catálogo</button>
            <button onclick="showSection('step-resumen')" id="nav-resumen" class="flex-1 py-4 text-[10px] font-black uppercase">3. Pedido (<span id="cart-count">0</span>)</button>
        </nav>

        <main class="p-4 flex-grow">
            <section id="step-cliente" class="space-y-4">
                <div class="bg-blue-50 p-5 rounded-xl border border-blue-100 shadow-inner">
                    <h2 class="font-bold text-blue-900 mb-4 text-xs uppercase tracking-widest">Datos del Solicitante</h2>
                    <div class="flex gap-4 mb-5 text-[10px] font-black">
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="t_cli" value="existente" checked onclick="toggleNew(false)"> EXISTENTE</label>
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="t_cli" value="nuevo" onclick="toggleNew(true)"> NUEVO CLIENTE</label>
                    </div>
                    <div class="space-y-3">
                        <input type="text" id="c_nom" placeholder="Nombre y Apellido *" class="w-full p-3 text-sm border rounded-lg focus:ring-2 ring-blue-500 outline-none">
                        <input type="text" id="c_dni" placeholder="DNI o CUIT *" class="w-full p-3 text-sm border rounded-lg focus:ring-2 ring-blue-500 outline-none">
                        <div id="extra-fields" class="hidden space-y-3 border-t pt-3 mt-3">
                            <input type="text" id="c_loc" placeholder="Localidad *" class="w-full p-3 text-sm border rounded-lg">
                            <input type="text" id="c_mat" placeholder="Matrícula Profesional *" class="w-full p-3 text-sm border rounded-lg">
                        </div>
                    </div>
                </div>
                <button onclick="validateAndGo()" class="w-full bg-slate-800 text-white py-4 rounded-xl font-black text-sm shadow-xl hover:bg-slate-700 uppercase tracking-widest">Ver Catálogo</button>
            </section>

            <section id="step-productos" class="hidden">
                <div class="flex overflow-x-auto gap-2 mb-6 pb-2 no-scrollbar">
                    <button onclick="renderCat('monopieza')" class="px-5 py-2 bg-cian text-black rounded-full text-[10px] font-black flex-shrink-0 border border-black shadow-sm">MP</button>
                    <button onclick="renderCat('basales')" class="px-5 py-2 bg-gris text-white rounded-full text-[10px] font-black flex-shrink-0 shadow-sm">IB / IBT (BASALES)</button>
                    <button onclick="renderCat('compresivos')" class="px-5 py-2 bg-fucsia text-white rounded-full text-[10px] font-black flex-shrink-0 shadow-sm">CMU / C3MU</button>
                    <button onclick="renderCat('analogicos')" class="px-5 py-2 bg-slate-800 text-white rounded-full text-[10px] font-black flex-shrink-0 shadow-sm">ANALOGICOS</button>
                </div>
                <div id="catalog-container" class="space-y-4"></div>
            </section>

            <section id="step-resumen" class="hidden">
                <h3 class="font-black text-lg mb-4 text-slate-800 uppercase">Detalle del Pedido</h3>
                <div id="cart-list" class="space-y-2 border-t pt-4"></div>
                <div class="mt-8">
                    <label class="block text-[10px] font-black text-slate-500 mb-2 uppercase">Notas de entrega:</label>
                    <textarea id="obs" class="w-full border p-4 rounded-xl h-24 text-sm outline-none focus:ring-2 ring-green-500" placeholder="Aclaraciones..."></textarea>
                </div>
                <button onclick="sendWA()" class="w-full mt-6 bg-green-600 text-white py-5 rounded-2xl font-black text-sm shadow-2xl hover:bg-green-700 uppercase">Enviar Pedido WhatsApp</button>
            </section>
        </main>
    </div>

    <script>
        const DB = {
            monopieza: {
                "MP Ø3.0": { col: "cian", items: ["MP Ø3.0x6mm","MP Ø3.0x8mm","MP Ø3.0x10mm","MP Ø3.0x11.5mm","MP Ø3.0x13mm","MP Ø3.0x15mm","MP Ø3.0x18mm","MP Ø3.0x20mm"] },
                "MP Ø3.5": { col: "cian", items: ["MP Ø3.5x6mm","MP Ø3.5x8mm","MP Ø3.5x10mm","MP Ø3.5x11.5mm","MP Ø3.5x13mm","MP Ø3.5x15mm","MP Ø3.5x18mm","MP Ø3.5x20mm"] },
                "MP Ø4.0": { col: "cian", items: ["MP Ø4.0x6mm","MP Ø4.0x8mm","MP Ø4.0x10mm","MP Ø4.0x11.5mm","MP Ø4.0x13mm","MP Ø4.0x15mm","MP Ø4.0x18mm","MP Ø4.0x20mm"] },
                "MP Ø4.5": { col: "cian", items: ["MP Ø4.5x6mm","MP Ø4.5x8mm","MP Ø4.5x10mm","MP Ø4.5x11.5mm","MP Ø4.5x13mm","MP Ø4.5x15mm","MP Ø4.5x18mm","MP Ø4.5x20mm"] },
                "MP Ø5.0/5.5": { col: "cian", items: ["MP Ø5.0x6mm","MP Ø5.0x13mm","MP Ø5.5x6mm","MP Ø5.5x13mm"] }
            },
            basales: {
                "IB - BASAL PULIDO": { col: "gris", items: [
                    "IB Ø3.5x10mm","IB Ø3.5x12mm","IB Ø3.5x14mm","IB Ø3.5x15mm","IB Ø3.5x18mm","IB Ø3.5x21mm","IB Ø3.5x23mm","IB Ø3.5x26mm","IB Ø3.5x28mm","IB Ø3.5x24 C14","IB Ø3.5x26 C16","IB Ø3.5x28 C18",
                    "IB Ø4.5x10mm","IB Ø4.5x12mm","IB Ø4.5x15mm","IB Ø4.5x18mm","IB Ø4.5x21mm","IB Ø4.5x23mm","IB Ø4.5x26mm","IB Ø4.5x28mm","IB Ø4.5x24 C14","IB Ø4.5x26 C16","IB Ø4.5x28 C18",
                    "IB Ø5.5x9mm","IB Ø5.5x10mm","IB Ø5.5x12mm","IB Ø5.5x15mm","IB Ø5.5x18mm","IB Ø6.5x9mm","IB Ø6.5x10mm","IB Ø8.5x9mm","IB Ø8.5x15mm"
                ]},
                "IBT - BASAL TRATAMIENTO": { col: "slate-600", items: [
                    "IBT Ø3.5x10mm","IBT Ø3.5x12mm","IBT Ø3.5x14mm","IBT Ø3.5x15mm","IBT Ø3.5x18mm","IBT Ø3.5x21mm","IBT Ø3.5x23mm","IBT Ø3.5x26mm","IBT Ø3.5x28mm","IBT Ø3.5x24 C14","IBT Ø3.5x26 C16","IBT Ø3.5x28 C18",
                    "IBT Ø4.5x10mm","IBT Ø4.5x12mm","IBT Ø4.5x15mm","IBT Ø4.5x18mm","IBT Ø4.5x21mm","IBT Ø4.5x23mm","IBT Ø4.5x26mm","IBT Ø4.5x28mm","IBT Ø4.5x24 C14","IBT Ø4.5x26 C16","IBT Ø4.5x28 C18",
                    "IBT Ø5.5x9mm","IBT Ø5.5x15mm","IBT Ø6.5x10mm","IBT Ø6.5x15mm","IBT Ø8.5x9mm","IBT Ø8.5x15mm"
                ]}
            },
            compresivos: {
                "CMU - COMPRESIVO MULTI UNIT": { col: "fucsia", items: [
                    "CMU Ø3.0x6mm","CMU Ø3.0x8mm","CMU Ø3.0x10mm","CMU Ø3.0x11.5mm","CMU Ø3.0x13mm","CMU Ø3.0x15mm","CMU Ø3.0x18mm","CMU Ø3.0x20mm",
                    "CMU Ø3.5x6mm","CMU Ø3.5x8mm","CMU Ø3.5x10mm","CMU Ø3.5x11.5mm","CMU Ø3.5x13mm","CMU Ø3.5x15mm","CMU Ø3.5x18mm","CMU Ø3.5x20mm",
                    "CMU Ø4.0x6mm","CMU Ø4.0x8mm","CMU Ø4.0x10mm","CMU Ø4.0x11.5mm","CMU Ø4.0x13mm","CMU Ø4.0x15mm","CMU Ø4.0x18mm","CMU Ø4.0x20mm",
                    "CMU Ø4.5x6mm","CMU Ø4.5x8mm","CMU Ø4.5x10mm","CMU Ø4.5x11.5mm","CMU Ø4.5x13mm","CMU Ø4.5x15mm","CMU Ø4.5x18mm","CMU Ø4.5x20mm",
                    "CMU Ø5.0x6mm","CMU Ø5.0x13mm","CMU Ø5.5x6mm","CMU Ø5.5x13mm"
                ]},
                "C3MU - COMPRESIVO CON CUELLO C3": { col: "fucsia", items: [
                    "C3MU Ø3.0x6mm","C3MU Ø3.0x10mm","C3MU Ø3.0x15mm","C3MU Ø3.0x20mm",
                    "C3MU Ø3.5x6mm","C3MU Ø3.5x10mm","C3MU Ø3.5x15mm","C3MU Ø3.5x20mm",
                    "C3MU Ø4.0x6mm","C3MU Ø4.0x10mm","C3MU Ø4.0x15mm","C3MU Ø4.0x20mm",
                    "C3MU Ø4.5x6mm","C3MU Ø4.5x10mm","C3MU Ø4.5x15mm","C3MU Ø4.5x20mm",
                    "C3MU Ø5.0x6mm","C3MU Ø5.0x13mm","C3MU Ø5.5x6mm","C3MU Ø5.5x13mm"
                ]}
            },
            analogicos: {
                "SISTEMA HI (HEX. INTERNO)": { col: "slate-700", products: {
                    "UCLA CALCINABLE": ["ROTACIONAL", "ANTI-ROT"],
                    "TRANSFER CUBETA": ["ABIERTA", "CERRADA"],
                    "TAPA CICATRIZAL": ["H1", "H2", "H3", "H4"]
                }}
            }
        };

        let cart = {};
        let currentKey = 'monopieza';

        function toggleNew(show) { document.getElementById('extra-fields').classList.toggle('hidden', !show); }

        function validateAndGo() {
            const nom = document.getElementById('c_nom').value;
            const dni = document.getElementById('c_dni').value;
            if (!nom || !dni) return alert("ERROR: Ingrese Nombre y DNI");
            document.getElementById('nav-productos').classList.remove('opacity-40');
            showSection('step-productos');
            renderCat(currentKey);
        }

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(id.replace('step-', 'nav-')).classList.add('active-tab');
            if(id === 'step-resumen') renderCart();
        }

        function renderCat(key) {
            currentKey = key;
            const container = document.getElementById('catalog-container');
            container.innerHTML = "";
            const data = DB[key];
            for (const subcat in data) {
                let section = `<div class="bg-white rounded-xl border shadow-sm overflow-hidden mb-5">
                    <h3 class="p-3 text-[10px] font-black uppercase tracking-widest ${'bg-'+data[subcat].col} border-b text-center shadow-sm">${subcat}</h3>
                    <div class="divide-y divide-gray-100">`;
                if (key === 'analogicos') {
                    for (const prod in data[subcat].products) {
                        section += `<div class="p-2 bg-slate-50 border-b"><p class="text-[9px] font-black text-slate-400 uppercase ml-2 mb-1">${prod}</p>`;
                        data[subcat].products[prod].forEach(v => section += renderRow(`${subcat} ${prod} ${v}`));
                        section += `</div>`;
                    }
                } else {
                    data[subcat].items.forEach(item => section += renderRow(item));
                }
                section += `</div></div>`;
                container.innerHTML += section;
            }
        }

        function renderRow(name) {
            const qty = cart[name] || 0;
            return `
                <div class="flex items-center justify-between py-3 px-4 bg-white transition-all">
                    <span class="text-[11px] font-bold text-slate-700 w-2/3">${name}</span>
                    <div class="flex items-center gap-2">
                        <button onclick="updateQty('${name}', -1)" class="w-7 h-7 rounded bg-gray-100 border font-black text-sm">-</button>
                        <span class="text-xs font-black min-w-[15px] text-center">${qty}</span>
                        <button onclick="updateQty('${name}', 1)" class="w-7 h-7 rounded bg-blue-600 text-white font-black text-sm">+</button>
                    </div>
                </div>`;
        }

        function updateQty(item, delta) {
            cart[item] = (cart[item] || 0) + delta;
            if (cart[item] <= 0) delete cart[item];
            document.getElementById('cart-count').innerText = Object.values(cart).reduce((a, b) => a + b, 0);
            renderCat(currentKey);
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            const items = Object.entries(cart);
            list.innerHTML = items.length === 0 ? "<p class='py-10 text-center text-slate-400 text-xs italic'>Su pedido está vacío</p>" : "";
            items.forEach(([name, qty]) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl border mb-2">
                        <div class="text-[11px] font-black"><span class="text-blue-600 mr-2">${qty}x</span> ${name}</div>
                        <button onclick="updateQty('${name}', -${qty}); renderCart();" class="text-[10px] text-red-500 font-black px-2">X</button>
                    </div>`;
            });
        }

        function sendWA() {
            if(Object.keys(cart).length === 0) return alert("CARRITO VACÍO");
            let msg = `*ORDEN DE PEDIDO BIO-FIX*\n*SOLICITANTE:* ${document.getElementById('c_nom').value.toUpperCase()}\n*DNI:* ${document.getElementById('c_dni').value}\n\n*PRODUCTOS:*\n`;
            Object.entries(cart).forEach(([item, qty]) => msg += `• ${qty} x ${item}\n`);
            if(document.getElementById('obs').value) msg += `\n*OBS:* ${document.getElementById('obs').value}`;
            window.open(`https://wa.me/5491122334455?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
