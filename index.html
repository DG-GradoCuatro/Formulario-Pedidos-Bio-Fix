<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Fix | Premium Ordering System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
        .hidden { display: none; }
        .btn-main { @apply w-full py-8 rounded-3xl font-black uppercase text-sm tracking-widest shadow-lg transition-all active:scale-[0.98] flex flex-col items-center justify-center gap-2; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-xl mx-auto min-h-screen flex flex-col relative">
        <header class="bg-slate-900 text-white p-8 pt-12 rounded-b-[40px] shadow-2xl text-center">
            <h1 class="text-4xl font-black tracking-tighter italic italic">BIO-FIX<span class="text-blue-500">®</span></h1>
            <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.5em] mt-2">Precision Implant Systems</p>
        </header>

        <nav class="glass sticky top-4 mx-4 mt-[-20px] p-3 rounded-2xl shadow-xl z-50 flex justify-between items-center border border-white/20">
            <button id="btn-volver" onclick="goBack()" class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-xl text-slate-900 font-bold hidden">←</button>
            <div class="flex flex-col ml-4">
                <span id="nav-title" class="text-[10px] font-black uppercase text-slate-400 leading-none">Bio-Fix System</span>
                <span id="nav-subtitle" class="text-xs font-black text-slate-900 uppercase">Inicio</span>
            </div>
            <button onclick="goToResumen()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-blue-200 shadow-lg flex items-center gap-2">
                Pedido (<span id="cart-count">0</span>)
            </button>
        </nav>

        <main class="p-6 mt-4 flex-grow">
            
            <section id="step-cliente" class="space-y-6">
                <div class="bg-white p-8 rounded-[32px] card-shadow border border-slate-100">
                    <h2 class="font-black text-slate-900 text-2xl mb-2">Bienvenido</h2>
                    <p class="text-slate-400 text-sm mb-8 font-medium">Complete sus datos para iniciar el pedido.</p>
                    <div class="space-y-4">
                        <input type="text" id="c_nom" placeholder="Nombre del Profesional" class="w-full p-5 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold text-slate-700">
                        <input type="text" id="c_dni" placeholder="Matrícula / CUIT" class="w-full p-5 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold text-slate-700">
                    </div>
                </div>
                <button onclick="validateAndStart()" class="w-full bg-slate-900 text-white py-6 rounded-[24px] font-black uppercase tracking-widest shadow-xl">Entrar al Catálogo</button>
            </section>

            <section id="step-menu" class="hidden grid grid-cols-1 gap-4">
                <button onclick="openSub('sub-implantes')" class="btn-main bg-white text-slate-900 border border-slate-100">
                    <span class="text-3xl">📦</span>
                    <span>Implantes</span>
                </button>
                <button onclick="alert('Próximamente')" class="btn-main bg-white/50 text-slate-300 border border-dashed border-slate-200 shadow-none">
                    <span class="text-3xl opacity-30">🔩</span>
                    <span>Componentes</span>
                </button>
                <button onclick="alert('Próximamente')" class="btn-main bg-white/50 text-slate-300 border border-dashed border-slate-200 shadow-none">
                    <span class="text-3xl opacity-30">🔧</span>
                    <span>Herramental</span>
                </button>
            </section>

            <section id="sub-implantes" class="hidden grid grid-cols-2 gap-3">
                <button onclick="loadProducts('monopieza', 'cyan')" class="btn-main bg-cyan-50 text-cyan-900 border border-cyan-100">MP</button>
                <button onclick="loadProducts('basales', 'slate')" class="btn-main bg-slate-100 text-slate-900 border border-slate-200 text-[10px]">Basales</button>
                <button onclick="loadProducts('compresivos', 'fuchsia')" class="btn-main bg-fuchsia-50 text-fuchsia-900 border border-fuchsia-100 text-[10px]">Compresivos</button>
                <button onclick="loadProducts('hi', 'red')" class="btn-main bg-red-50 text-red-900 border border-red-100">HI</button>
                <button onclick="loadProducts('he', 'green')" class="btn-main bg-green-50 text-green-900 border border-green-100">HE</button>
                <button onclick="loadProducts('cmhi', 'purple')" class="btn-main bg-purple-50 text-purple-900 border border-purple-100 text-[10px]">Cono Morse</button>
            </section>

            <section id="step-lista" class="hidden"></section>

            <section id="step-resumen" class="hidden space-y-4">
                <div id="cart-items" class="space-y-3"></div>
                <textarea id="obs" class="w-full p-5 rounded-3xl bg-slate-50 border-none h-32 font-bold text-sm" placeholder="Instrucciones de entrega..."></textarea>
                <button onclick="sendWA()" class="w-full bg-green-600 text-white py-6 rounded-[24px] font-black uppercase tracking-widest shadow-xl shadow-green-100">Finalizar por WhatsApp</button>
            </section>

        </main>
    </div>

    <script>

            basales: { "IB - PULIDO": ["IB Ø3.5x10mm","IB Ø3.5x12mm","IB Ø3.5x14mm","IB Ø3.5x15mm","IB Ø3.5x18mm","IB Ø3.5x21mm","IB Ø3.5x23mm","IB Ø3.5x26mm","IB Ø3.5x28mm","IB Ø3.5x24 C14","IB Ø3.5x26 C16","IB Ø3.5x28 C18","IB Ø4.5x10mm","IB Ø4.5x12mm","IB Ø4.5x15mm","IB Ø4.5x18mm","IB Ø4.5x21mm","IB Ø4.5x23mm","IB Ø4.5x26mm","IB Ø4.5x28mm","IB Ø4.5x24 C14","IB Ø4.5x26 C16","IB Ø4.5x28 C18","IB Ø5.5x9mm","IB Ø5.5x10mm","IB Ø5.5x12mm","IB Ø5.5x15mm","IB Ø5.5x18mm","IB Ø6.5x9mm","IB Ø6.5x10mm","IB Ø6.5x12mm","IB Ø6.5x15mm","IB Ø8.5x9mm","IB Ø8.5x10mm","IB Ø8.5x12mm","IB Ø8.5x15mm"], "IBT - TRATAMIENTO": ["IBT Ø3.5x10mm","IBT Ø3.5x12mm","IBT Ø3.5x14mm","IBT Ø3.5x15mm","IBT Ø3.5x18mm","IBT Ø3.5x21mm","IBT Ø3.5x23mm","IBT Ø3.5x26mm","IBT Ø3.5x28mm","IBT Ø3.5x24 C14","IBT Ø3.5x26 C16","IBT Ø3.5x28 C18","IBT Ø4.5x10mm","IBT Ø4.5x12mm","IBT Ø4.5x15mm","IBT Ø4.5x18mm","IBT Ø4.5x21mm","IBT Ø4.5x23mm","IBT Ø4.5x26mm","IBT Ø4.5x28mm","IBT Ø4.5x24 C14","IBT Ø4.5x26 C16","IBT Ø4.5x28 C18","IBT Ø5.5x9mm","IBT Ø5.5x10mm","IBT Ø5.5x12mm","IBT Ø5.5x15mm","IBT Ø5.5x18mm","IBT Ø6.5x9mm","IBT Ø6.5x10mm","IBT Ø6.5x12mm","IBT Ø6.5x15mm","IBT Ø8.5x9mm","IBT Ø8.5x10mm","IBT Ø8.5x12mm","IBT Ø8.5x15mm"] },
            compresivos: { "CMU": ["CMU Ø3.0x6mm","CMU Ø3.0x8mm","CMU Ø3.0x10mm","CMU Ø3.0x11.5mm","CMU Ø3.0x13mm","CMU Ø3.0x15mm","CMU Ø3.0x18mm","CMU Ø3.0x20mm","CMU Ø3.5x6mm","CMU Ø3.5x8mm","CMU Ø3.5x10mm","CMU Ø3.5x11.5mm","CMU Ø3.5x13mm","CMU Ø3.5x15mm","CMU Ø3.5x18mm","CMU Ø3.5x20mm","CMU Ø4.0x6mm","CMU Ø4.0x8mm","CMU Ø4.0x10mm","CMU Ø4.0x11.5mm","CMU Ø4.0x13mm","CMU Ø4.0x15mm","CMU Ø4.0x18mm","CMU Ø4.0x20mm","CMU Ø4.5x6mm","CMU Ø4.5x8mm","CMU Ø4.5x10mm","CMU Ø4.5x11.5mm","CMU Ø4.5x13mm","CMU Ø4.5x15mm","CMU Ø4.5x18mm","CMU Ø4.5x20mm","CMU Ø5.0x6mm","CMU Ø5.0x8mm","CMU Ø5.0x10mm","CMU Ø5.0x11.5mm","CMU Ø5.0x13mm","CMU Ø5.5x6mm","CMU Ø5.5x8mm","CMU Ø5.5x10mm","CMU Ø5.5x11.5mm","CMU Ø5.5x13mm"], "C3MU": ["C3MU Ø3.0x6mm","C3MU Ø3.0x8mm","C3MU Ø3.0x10mm","C3MU Ø3.0x11.5mm","C3MU Ø3.0x13mm","C3MU Ø3.0x15mm","C3MU Ø3.0x18mm","C3MU Ø3.0x20mm","C3MU Ø3.5x6mm","C3MU Ø3.5x8mm","C3MU Ø3.5x10mm","C3MU Ø3.5x11.5mm","C3MU Ø3.5x13mm","C3MU Ø3.5x15mm","C3MU Ø3.5x18mm","C3MU Ø3.5x20mm","C3MU Ø4.0x6mm","C3MU Ø4.0x8mm","C3MU Ø4.0x10mm","C3MU Ø4.0x11.5mm","C3MU Ø4.0x13mm","C3MU Ø4.0x15mm","C3MU Ø4.0x18mm","C3MU Ø4.0x20mm","C3MU Ø4.5x6mm","C3MU Ø4.5x8mm","C3MU Ø4.5x10mm","C3MU Ø4.5x11.5mm","C3MU Ø4.5x13mm","C3MU Ø4.5x15mm","C3MU Ø4.5x18mm","C3MU Ø4.5x20mm","C3MU Ø5.0x6mm","C3MU Ø5.0x8mm","C3MU Ø5.0x10mm","C3MU Ø5.0x11.5mm","C3MU Ø5.0x13mm","C3MU Ø5.5x6mm","C3MU Ø5.5x8mm","C3MU Ø5.5x10mm","C3MU Ø5.5x11.5mm","C3MU Ø5.5x13mm"] },
            hi: { "HEX INTERNO": ["HI Ø3.30x6.5mm","HI Ø3.30x8.0mm","HI Ø3.30x10mm","HI Ø3.30x11.5mm","HI Ø3.30x13mm","HI Ø3.30x16mm","HI Ø3.75x6.5mm","HI Ø3.75x8.0mm","HI Ø3.75x10mm","HI Ø3.75x11.5mm","HI Ø3.75x13mm","HI Ø3.75x16mm","HI Ø4.2x6.5mm","HI Ø4.2x8.0mm","HI Ø4.2x10mm","HI Ø4.2x11.5mm","HI Ø4.2x13mm","HI Ø4.2x16mm","HI Ø5.0x6.5mm","HI Ø5.0x8.0mm","HI Ø5.0x10mm","HI Ø5.0x11.5mm","HI Ø5.0x13mm","HI Ø5.0x16mm"] },
            he: { "HEX EXTERNO": ["HE Ø3.30x8.5mm","HE Ø3.30x10mm","HE Ø3.30x11.5mm","HE Ø3.30x13mm","HE Ø3.30x15mm","HE Ø3.75x8mm","HE Ø3.75x10mm","HE Ø3.75x11.5mm","HE Ø3.75x13mm","HE Ø3.75x15mm","HE Ø4.0x6mm","HE Ø4.0x8.5mm","HE Ø4.0x10mm","HE Ø4.0x11.5mm","HE Ø4.0x13mm","HE Ø4.0x15mm","HE Ø5.0x6mm","HE Ø5.0x8.5mm","HE Ø5.0x10mm","HE Ø5.0x11.5mm","HE Ø5.0x13mm","HE Ø5.0x15mm"] },
            cmhi: { "CONO MORSE": ["CMHI Ø3.30x8mm","CMHI Ø3.30x10mm","CMHI Ø3.30x11.5mm","CMHI Ø3.30x13mm","CMHI Ø3.30x16mm","CMHI Ø3.75x8mm","CMHI Ø3.75x10mm","CMHI Ø3.75x11.5mm","CMHI Ø3.75x13mm","CMHI Ø3.75x16mm","CMHI Ø4.20x8mm","CMHI Ø4.20x10mm","CMHI Ø4.20x11.5mm","CMHI Ø4.20x13mm","CMHI Ø4.20x16mm","CMHI Ø5.0x8mm","CMHI Ø5.0x10mm","CMHI Ø5.0x11.5mm","CMHI Ø5.0x13mm","CMHI Ø5.0x16mm"] }
        };

        let cart = {};
        let stack = ['step-cliente'];

        function showSection(id, push = true) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(push) stack.push(id);
            document.getElementById('btn-volver').classList.toggle('hidden', stack.length <= 2);
            updateLabels(id);
            if(push) window.scrollTo(0,0);
        }

        function updateLabels(id) {
            const subs = { 'step-menu': 'Inicio', 'sub-implantes': 'Implantes', 'step-lista': 'Catálogo', 'step-resumen': 'Resumen' };
            document.getElementById('nav-subtitle').innerText = subs[id] || 'Bio-Fix';
        }

        function goBack() {
            if(stack.length > 1) {
                stack.pop();
                showSection(stack.pop());
            }
        }

        function validateAndStart() {
            if(!document.getElementById('c_nom').value) return alert("Ingrese Profesional");
            showSection('step-menu');
        }

        function openSub(id) { showSection(id); }

        function loadProducts(key, color) {
            showSection('step-lista');
            const container = document.getElementById('step-lista');
            container.innerHTML = "";
            for (const sub in DB[key]) {
                let html = `<div class="bg-white rounded-[32px] overflow-hidden mb-8 card-shadow border border-slate-100">
                    <div class="bg-${color}-500 text-white p-6 font-black text-center text-xs uppercase tracking-widest">${sub}</div>
                    <div class="divide-y divide-slate-50">`;
                DB[key][sub].forEach(item => {
                    const q = cart[item] || 0;
                    html += `<div class="flex justify-between items-center p-5">
                        <span class="text-[11px] font-bold text-slate-600 uppercase">${item}</span>
                        <div class="flex items-center gap-4 bg-slate-50 p-1 rounded-2xl">
                            <button onclick="update('${item}',-1,'${key}','${color}', this)" class="w-10 h-10 flex items-center justify-center bg-white rounded-xl shadow-sm font-bold">-</button>
                            <span class="font-black text-sm w-4 text-center">${q}</span>
                            <button onclick="update('${item}',1,'${key}','${color}', this)" class="w-10 h-10 flex items-center justify-center bg-slate-900 text-white rounded-xl shadow-lg font-bold">+</button>
                        </div>
                    </div>`;
                });
                container.innerHTML += html + "</div></div>";
            }
        }

        // EL FIX DEL SCROLL ESTÁ AQUÍ
        function update(item, delta, key, color, btn) {
            cart[item] = (cart[item] || 0) + delta;
            if(cart[item] <= 0) delete cart[item];
            document.getElementById('cart-count').innerText = Object.values(cart).reduce((a,b)=>a+b, 0);
            
            // Actualizar solo el número del contador visualmente sin re-renderizar todo
            const counterSpan = btn.parentElement.querySelector('span');
            counterSpan.innerText = cart[item] || 0;
        }

        function goToResumen() {
            showSection('step-resumen');
            const container = document.getElementById('cart-items');
            container.innerHTML = "";
            const items = Object.entries(cart);
            if(items.length === 0) {
                container.innerHTML = "<div class='text-center py-20 opacity-20 font-black'>CARRITO VACÍO</div>";
                return;
            }
            items.forEach(([n, q]) => {
                container.innerHTML += `<div class="flex justify-between items-center p-6 bg-white rounded-[24px] card-shadow border border-slate-100">
                    <div class="flex flex-col"><span class="text-[10px] text-blue-500 font-black">CANTIDAD: ${q}</span><span class="text-xs font-black text-slate-800 uppercase">${n}</span></div>
                    <button onclick="delete cart['${n}']; goToResumen(); updateNavCount();" class="text-red-400 font-black text-[10px]">QUITAR</button>
                </div>`;
            });
        }

        function updateNavCount() {
            document.getElementById('cart-count').innerText = Object.values(cart).reduce((a,b)=>a+b, 0);
        }

        function sendWA() {
            let m = `*PEDIDO BIO-FIX®*\n*PROFESIONAL:* ${document.getElementById('c_nom').value.toUpperCase()}\n*ID:* ${document.getElementById('c_dni').value.toUpperCase()}\n\n*PRODUCTOS:*\n`;
            Object.entries(cart).forEach(([n,q])=> m+=`✅ ${q} x ${n}\n`);
            window.open(`https://wa.me/5491122334455?text=${encodeURIComponent(m)}`);
        }
    </script>
</body>
</html>
