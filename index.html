<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Fix | Pedidos Profesionales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-cian { background-color: #00FFFF; color: #000; }
        .bg-rojo { background-color: #FF0000; color: #fff; }
        .bg-verde { background-color: #008000; color: #fff; }
        .bg-violeta { background-color: #8A2BE2; color: #fff; }
        .bg-gris { background-color: #808080; color: #fff; }
        .bg-fucsia { background-color: #FF00FF; color: #fff; }
        .hidden { display: none; }
        .active-tab { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 800; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

    <div class="max-w-xl mx-auto bg-white min-h-screen shadow-2xl flex flex-col">
        <header class="bg-slate-900 text-white p-5 text-center">
            <h1 class="text-2xl font-black tracking-tighter">BIO-FIX®</h1>
            <p class="text-[10px] text-blue-400 font-bold uppercase tracking-[0.2em]">Catálogo Completo de Implantes</p>
        </header>

        <nav class="flex border-b sticky top-0 bg-white z-50 shadow-sm">
            <button onclick="showSection('step-cliente')" id="nav-cliente" class="flex-1 py-4 text-[10px] font-bold active-tab uppercase">1. Identificación</button>
            <button onclick="validateAndGo()" id="nav-productos" class="flex-1 py-4 text-[10px] font-bold uppercase opacity-40">2. Catálogo</button>
            <button onclick="showSection('step-resumen')" id="nav-resumen" class="flex-1 py-4 text-[10px] font-bold uppercase">3. Resumen (<span id="cart-count">0</span>)</button>
        </nav>

        <main class="p-4 flex-grow">
            <section id="step-cliente" class="space-y-4">
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                    <h2 class="font-bold text-slate-800 mb-4 text-sm uppercase">Datos del Profesional</h2>
                    <div class="flex gap-4 mb-5">
                        <label class="text-xs font-bold flex items-center gap-1"><input type="radio" name="t_cli" value="existente" checked onclick="toggleNew(false)"> EXISTENTE</label>
                        <label class="text-xs font-bold flex items-center gap-1"><input type="radio" name="t_cli" value="nuevo" onclick="toggleNew(true)"> NUEVO</label>
                    </div>
                    <div class="space-y-3">
                        <input type="text" id="c_nom" placeholder="Nombre y Apellido *" class="w-full p-3 text-sm border rounded-lg outline-none focus:ring-2 ring-blue-500">
                        <input type="text" id="c_dni" placeholder="DNI o CUIT *" class="w-full p-3 text-sm border rounded-lg outline-none focus:ring-2 ring-blue-500">
                        <div id="extra-fields" class="hidden space-y-3">
                            <input type="text" id="c_loc" placeholder="Localidad *" class="w-full p-3 text-sm border rounded-lg">
                            <input type="text" id="c_pro" placeholder="Provincia *" class="w-full p-3 text-sm border rounded-lg">
                            <input type="text" id="c_mat" placeholder="Matrícula Profesional *" class="w-full p-3 text-sm border rounded-lg">
                        </div>
                    </div>
                </div>
                <button onclick="validateAndGo()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-sm shadow-lg hover:bg-blue-700 transition-all">ACCEDER AL CATÁLOGO</button>
            </section>

            <section id="step-productos" class="hidden">
                <div class="flex overflow-x-auto gap-2 mb-6 pb-2 no-scrollbar">
                    <button onclick="renderCat('monopieza')" class="px-5 py-2 bg-cian text-black rounded-full text-[10px] font-bold flex-shrink-0 border border-black">MONOPIEZA</button>
                    <button onclick="renderCat('implantes')" class="px-5 py-2 bg-slate-800 text-white rounded-full text-[10px] font-bold flex-shrink-0">OTROS IMPLANTES</button>
                    <button onclick="renderCat('analogicos')" class="px-5 py-2 bg-slate-800 text-white rounded-full text-[10px] font-bold flex-shrink-0">ANALÓGICOS</button>
                    <button onclick="renderCat('herramental')" class="px-5 py-2 bg-slate-800 text-white rounded-full text-[10px] font-bold flex-shrink-0">HERRAMENTAL</button>
                </div>
                
                <div id="catalog-container" class="space-y-4"></div>
            </section>

            <section id="step-resumen" class="hidden">
                <h3 class="font-black text-lg mb-4 text-slate-800">Resumen del Pedido</h3>
                <div id="cart-list" class="space-y-2 border-t pt-4"></div>
                <div class="mt-8">
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Notas adicionales:</label>
                    <textarea id="obs" class="w-full border p-3 rounded-xl h-24 text-sm" placeholder="Indicaciones especiales..."></textarea>
                </div>
                <button onclick="sendWA()" class="w-full mt-6 bg-green-600 text-white py-4 rounded-xl font-black text-sm shadow-xl hover:bg-green-700 uppercase tracking-widest text-center">Enviar WhatsApp</button>
            </section>
        </main>
    </div>

    <script>
        const DB = {
            monopieza: {
                "Monopieza Ø3.0": { col: "cian", items: ["Ø3.0 x 6mm","Ø3.0 x 8mm","Ø3.0 x 10mm","Ø3.0 x 11.5mm","Ø3.0 x 13mm","Ø3.0 x 15mm","Ø3.0 x 18mm","Ø3.0 x 20mm"] },
                "Monopieza Ø3.5": { col: "cian", items: ["Ø3.5 x 6mm","Ø3.5 x 8mm","Ø3.5 x 10mm","Ø3.5 x 11.5mm","Ø3.5 x 13mm","Ø3.5 x 15mm","Ø3.5 x 18mm","Ø3.5 x 20mm"] },
                "Monopieza Ø4.0": { col: "cian", items: ["Ø4.0 x 6mm","Ø4.0 x 8mm","Ø4.0 x 10mm","Ø4.0 x 11.5mm","Ø4.0 x 13mm","Ø4.0 x 15mm","Ø4.0 x 18mm","Ø4.0 x 20mm"] },
                "Monopieza Ø4.5": { col: "cian", items: ["Ø4.5 x 6mm","Ø4.5 x 8mm","Ø4.5 x 10mm","Ø4.5 x 11.5mm","Ø4.5 x 13mm","Ø4.5 x 15mm","Ø4.5 x 18mm","Ø4.5 x 20mm"] },
                "Monopieza Ø5.0": { col: "cian", items: ["Ø5.0 x 6mm","Ø5.0 x 8mm","Ø5.0 x 10mm","Ø5.0 x 11.5mm","Ø5.0 x 13mm"] },
                "Monopieza Ø5.5": { col: "cian", items: ["Ø5.5 x 6mm","Ø5.5 x 8mm","Ø5.5 x 10mm","Ø5.5 x 11.5mm","Ø5.5 x 13mm"] }
            },
            implantes: {
                "Hexágono Interno": { col: "rojo", items: ["HI Ø3.75 x 10 mm", "HI Ø3.75 x 13 mm", "HI Ø4.2 x 11.5 mm"] },
                "Hexágono Externo": { col: "verde", items: ["HE Ø3.75 x 13 mm", "HE Ø4.0 x 10 mm"] },
                "Cono Morse": { col: "violeta", items: ["CM Ø3.30 x 13 mm", "CM Ø4.2 x 11.5 mm"] }
            },
            analogicos: {
                "Hexágono Interno": { col: "slate-700", products: {
                    "Ucla Calcinable": ["Rotacional", "Anti-Rotacional"],
                    "BallAttach": ["H1", "H2", "H3", "H4"]
                }}
            },
            herramental: {
                "Fresas": { col: "slate-700", items: ["Fresa Lanza Corta", "Fresa Helicoidal Ø2.0"] }
            }
        };

        let cart = {};
        let currentOpenKey = 'monopieza';

        function toggleNew(show) { document.getElementById('extra-fields').classList.toggle('hidden', !show); }

        function validateAndGo() {
            const nom = document.getElementById('c_nom').value;
            const dni = document.getElementById('c_dni').value;
            if (!nom || !dni) return alert("COMPLETE NOMBRE Y DNI");
            document.getElementById('nav-productos').classList.remove('opacity-40');
            showSection('step-productos');
            renderCat(currentOpenKey);
        }

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(id.replace('step-', 'nav-')).classList.add('active-tab');
            if(id === 'step-resumen') renderCart();
        }

        function renderCat(key) {
            currentOpenKey = key;
            const container = document.getElementById('catalog-container');
            container.innerHTML = "";
            const data = DB[key];

            for (const subcat in data) {
                let section = `<div class="bg-white rounded-lg border shadow-sm overflow-hidden mb-4">
                    <h3 class="p-3 text-[10px] font-black uppercase tracking-wider ${'bg-'+data[subcat].col} border-b text-center">${subcat}</h3>
                    <div class="divide-y divide-slate-100">`;
                
                if (key === 'analogicos') {
                    for (const prod in data[subcat].products) {
                        section += `<div class="p-2 bg-slate-50 border-b"><p class="text-[9px] font-bold text-slate-400 uppercase ml-2">${prod}</p>`;
                        data[subcat].products[prod].forEach(v => section += renderRow(`${subcat} ${prod} ${v}`));
                        section += `</div>`;
                    }
                } else {
                    data[subcat].items.forEach(item => section += renderRow(item));
                }
                section += `</div></div>`;
                container.innerHTML += section;
            }
        }

        function renderRow(name) {
            const qty = cart[name] || 0;
            return `
                <div class="flex items-center justify-between py-2 px-4 bg-white">
                    <span class="text-[11px] font-semibold text-slate-700">${name}</span>
                    <div class="flex items-center gap-2">
                        <button onclick="updateQty('${name}', -1)" class="w-6 h-6 rounded border bg-slate-50 font-bold text-xs">-</button>
                        <span class="text-xs font-bold min-w-[15px] text-center">${qty}</span>
                        <button onclick="updateQty('${name}', 1)" class="w-6 h-6 rounded bg-blue-600 text-white font-bold text-xs">+</button>
                    </div>
                </div>`;
        }

        function updateQty(item, delta) {
            cart[item] = (cart[item] || 0) + delta;
            if (cart[item] <= 0) delete cart[item];
            document.getElementById('cart-count').innerText = Object.values(cart).reduce((a, b) => a + b, 0);
            renderCat(currentOpenKey);
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = Object.entries(cart).length === 0 ? "<p class='text-center text-slate-400 text-xs py-10'>Carrito vacío</p>" : "";
            Object.entries(cart).forEach(([name, qty]) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg border-l-4 border-blue-500 mb-2">
                        <div class="text-[11px] font-bold"><strong>${qty}x</strong> ${name}</div>
                        <button onclick="updateQty('${name}', -${qty}); renderCart();" class="text-[10px] text-red-500 font-bold uppercase">X</button>
                    </div>`;
            });
        }

        function sendWA() {
            if(Object.keys(cart).length === 0) return alert("CARRITO VACÍO");
            let msg = `*PEDIDO BIO-FIX*\n*CLIENTE:* ${document.getElementById('c_nom').value.toUpperCase()}\n*DNI:* ${document.getElementById('c_dni').value}\n\n*PRODUCTOS:*\n`;
            Object.entries(cart).forEach(([item, qty]) => msg += `• ${qty} x ${item}\n`);
            if(document.getElementById('obs').value) msg += `\n*OBS:* ${document.getElementById('obs').value}`;
            window.open(`https://wa.me/5491122334455?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
