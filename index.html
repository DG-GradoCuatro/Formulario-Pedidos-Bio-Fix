<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Fix | Formulario de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bio-blue: #0056b3; }
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .bg-cian { background-color: #00FFFF; }
        .bg-rojo { background-color: #FF0000; color: white; }
        .bg-verde { background-color: #008000; color: white; }
        .bg-violeta { background-color: #8A2BE2; color: white; }
        .bg-gris { background-color: #808080; color: white; }
        .bg-fucsia { background-color: #FF00FF; color: white; }
        .hidden { display: none; }
        .active-tab { border-bottom: 4px solid var(--bio-blue); color: var(--bio-blue); font-weight: bold; }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-lg overflow-hidden">
        <header class="bg-slate-800 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">BIO-FIX CATALOG</h1>
            <p class="text-xs opacity-75">Gestión de Pedidos v2.0</p>
        </header>

        <nav class="flex border-b bg-gray-50 text-sm">
            <button onclick="showSection('step-cliente')" id="btn-step-cliente" class="flex-1 p-3 active-tab">1. CLIENTE</button>
            <button onclick="showSection('step-productos')" id="btn-step-productos" class="flex-1 p-3">2. PRODUCTOS</button>
            <button onclick="showSection('step-resumen')" id="btn-step-resumen" class="flex-1 p-3">3. RESUMEN (<span id="cart-count">0</span>)</button>
        </nav>

        <main class="p-5">
            <section id="step-cliente" class="section-content">
                <div class="flex gap-4 mb-6 justify-center">
                    <label class="flex items-center gap-2 border p-3 rounded cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="tipo_cliente" value="existente" checked onchange="toggleClienteFields()"> Cliente Existente
                    </label>
                    <label class="flex items-center gap-2 border p-3 rounded cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="tipo_cliente" value="nuevo" onchange="toggleClienteFields()"> Nuevo Cliente
                    </label>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="cli-nombre" placeholder="Nombre y Apellido" class="border p-2 rounded">
                    <input type="text" id="cli-dni" placeholder="DNI / CUIT" class="border p-2 rounded">
                    <div id="campos-nuevo" class="hidden contents">
                        <input type="text" id="cli-localidad" placeholder="Localidad" class="border p-2 rounded">
                        <input type="text" id="cli-provincia" placeholder="Provincia" class="border p-2 rounded">
                        <input type="text" id="cli-matricula" placeholder="Matrícula Profesional" class="border p-2 rounded">
                    </div>
                </div>
                <button onclick="showSection('step-productos')" class="w-full mt-6 bg-blue-600 text-white py-3 rounded font-bold">IR AL CATÁLOGO →</button>
            </section>

            <section id="step-productos" class="section-content hidden">
                <div class="grid grid-cols-2 gap-2 mb-6">
                    <button onclick="renderCategory('Implantes')" class="p-3 border rounded bg-slate-100 font-bold text-xs uppercase">Implantes</button>
                    <button onclick="renderCategory('Componentes Analógicos')" class="p-3 border rounded bg-slate-100 font-bold text-xs uppercase">Analógicos</button>
                    <button onclick="renderCategory('Componentes Digitales')" class="p-3 border rounded bg-slate-100 font-bold text-xs uppercase">Digitales (Próximamente)</button>
                    <button onclick="renderCategory('Herramental')" class="p-3 border rounded bg-slate-100 font-bold text-xs uppercase">Herramental</button>
                </div>

                <div id="product-list" class="space-y-4">
                    <p class="text-center text-gray-400 italic">Seleccione una categoría para ver los productos...</p>
                </div>
            </section>

            <section id="step-resumen" class="section-content hidden">
                <div id="cart-items" class="space-y-2 mb-6"></div>
                <textarea id="pedido-obs" placeholder="Observaciones especiales..." class="w-full border p-2 rounded h-20 mb-4"></textarea>
                <button onclick="enviarWA()" class="w-full bg-green-600 text-white py-4 rounded-full font-bold text-lg shadow-lg">GENERAR PEDIDO WHATSAPP</button>
            </section>
        </main>
    </div>

    <script>
        const catalogo = {
            "Implantes": {
                "Hexágono Interno": { color: "rojo", items: ["Ø3.0 x 6.5 mm","Ø3.0 x 8 mm","Ø3.0 x 10 mm","Ø3.0 x 11.5 mm","Ø3.0 x 13 mm","Ø3.0 x 16 mm","Ø3.75 x 6.5 mm","Ø3.75 x 8 mm","Ø3.75 x 10 mm","Ø3.75 x 11.5 mm","Ø3.75 x 13 mm","Ø3.75 x 16 mm","Ø4.2 x 6.5 mm","Ø4.2 x 8 mm","Ø4.2 x 10 mm","Ø4.2 x 11.5 mm","Ø4.2 x 13 mm","Ø4.2 x 16 mm","Ø5.0 x 6.5 mm","Ø5.0 x 8 mm","Ø5.0 x 10 mm","Ø5.0 x 11.5 mm","Ø5.0 x 13 mm","Ø5.0 x 16 mm"] },
                "Hexágono Externo": { color: "verde", items: { "Ø3.30 (Plat 3.4)": ["8.5 mm","10 mm","11.5 mm","13 mm","15 mm"], "Ø3.75 (Plat 4.1)": ["8.5 mm","10 mm","11.5 mm","13 mm","15 mm"], "Ø4.0 (Plat 4.1)": ["6 mm","8.5 mm","10 mm","11.5 mm","13 mm","15 mm"], "Ø5.0 (Plat 5.0)": ["8.5 mm","10 mm","11.5 mm","13 mm","15 mm"] } },
                "Cono Morse": { color: "violeta", items: ["Ø3.30 x 8 mm","Ø3.30 x 10 mm","Ø3.0 x 11.5 mm","Ø3.30 x 13 mm","Ø3.30 x 16 mm","Ø3.75 x 8 mm","Ø3.75 x 10 mm","Ø3.75 x 11.5 mm","Ø3.75 x 13 mm","Ø3.75 x 16 mm","Ø4.2 x 8 mm","Ø4.2 x 10 mm","Ø4.2 x 11.5 mm","Ø4.2 x 13 mm","Ø4.2 x 16 mm","Ø5.0 x 8 mm","Ø5.0 x 10 mm","Ø5.0 x 11.5 mm","Ø5.0 x 13 mm","Ø5.0 x 16 mm"] },
                "Monopieza": { color: "cian", items: ["Ø3.0 x 6 mm","Ø3.5 x 10 mm","Ø4.0 x 13 mm","Ø4.5 x 15 mm","Ø5.0 x 10 mm","Ø5.5 x 13 mm"] }, // Truncado por espacio, añadir más según patrón
                "Monopieza Basal": { color: "gris", items: { "Pulido": ["Ø3.5 x 10 mm","Ø3.5 x 28 mm","Ø4.5 x 10 mm","Ø5.5 x 12 mm"], "Tratamiento": ["Ø3.5 x 10 mm","Ø4.5 x 21 mm"] } },
                "Compresivo Multiunit": { color: "fucsia", items: ["Ø3.0 x 6 mm Normal","Ø3.0 x 6 mm C3","Ø3.5 x 10 mm Normal","Ø3.5 x 10 mm C3"] }
            },
            "Componentes Analógicos": {
                "Hexágono Interno": { items: { "Ucla Calcinable": ["Rotacional","Anti-Rotacional"], "BallAttach": ["H1","H2","H3","H4"], "Pilar Recto": ["H1","H2","H3","H4"], "Pilar Angulado": ["15°","25°"] } },
                "Cono Morse": { items: { "Pilar Estándar Ø3.3": ["Ø3.3x0.8x4","Ø3.3x2.5x6"], "Pilar Cicatrizal": ["H1.5","H2.5","H3.5"] } }
            },
            "Herramental": {
                "Fresas": { items: { "Fresa Lanza": ["Corta","Larga"], "Fresa Helicoidal": ["Ø2.0","Ø2.8","Ø3.2","Ø4.0"] } },
                "Instrumental": { items: ["Torquimetro Dinamometrico", "Mango Rigido", "Extractor de Raiz"] },
                "Drivers": { items: { "Destornillador Digital Cuadrado": ["Corto 0.050","Estándar 0.050","Largo 0.050"], "Punch": ["3.4mm","4.1mm","5.0mm"] } }
            }
        };

        let carrito = [];

        function showSection(id) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('btn-' + id).classList.add('active-tab');
        }

        function toggleClienteFields() {
            const tipo = document.querySelector('input[name="tipo_cliente"]:checked').value;
            document.getElementById('campos-nuevo').classList.toggle('hidden', tipo === 'existente');
        }

        function renderCategory(catName) {
            const container = document.getElementById('product-list');
            container.innerHTML = `<h2 class="font-bold text-blue-900 border-b-2 border-blue-900 mb-4">${catName.toUpperCase()}</h2>`;
            
            const data = catalogo[catName];
            
            for (let subcat in data) {
                const config = data[subcat];
                const colorClass = config.color ? `bg-${config.color}` : 'bg-white border';
                
                let html = `<div class="p-4 rounded shadow-sm mb-3 ${colorClass}">
                                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                    <span class="font-bold">${subcat}</span>
                                    <div class="flex gap-2 w-full md:w-auto">`;

                // Si tiene sub-niveles (objetos)
                if (!Array.isArray(config.items)) {
                    html += `<select id="opt-${subcat}" class="text-black p-1 rounded text-sm w-full">`;
                    for (let key in config.items) {
                        if (Array.isArray(config.items[key])) {
                            config.items[key].forEach(val => {
                                html += `<option value="${key} - ${val}">${key} | ${val}</option>`;
                            });
                        } else {
                            html += `<option value="${key}">${key}</option>`;
                        }
                    }
                    html += `</select>`;
                } else {
                    // Si es array simple
                    html += `<select id="opt-${subcat}" class="text-black p-1 rounded text-sm w-full">`;
                    config.items.forEach(val => {
                        html += `<option value="${val}">${val}</option>`;
                    });
                    html += `</select>`;
                }

                html += `<input type="number" id="qty-${subcat}" value="1" min="1" class="w-12 text-black text-center rounded">
                         <button onclick="add('${subcat}', '${config.color || 'gris'}')" class="bg-white text-slate-800 px-4 py-1 rounded font-bold hover:bg-yellow-400 transition"> + </button>
                        </div></div></div>`;
                container.innerHTML += html;
            }
        }

        function add(sistema, color) {
            const select = document.getElementById(`opt-${sistema}`);
            const qty = document.getElementById(`qty-${sistema}`).value;
            
            carrito.push({
                nombre: `${sistema} (${select.value})`,
                cantidad: qty,
                color: color
            });
            
            document.getElementById('cart-count').innerText = carrito.length;
            renderCart();
            alert("Añadido al pedido");
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if(carrito.length === 0) {
                container.innerHTML = "<p class='text-center text-gray-400'>No hay productos seleccionados.</p>";
                return;
            }
            container.innerHTML = carrito.map((item, i) => `
                <div class="flex justify-between bg-white p-3 border rounded shadow-sm">
                    <span><strong>${item.cantidad}x</strong> ${item.nombre}</span>
                    <button onclick="remove(${i})" class="text-red-500 font-bold">X</button>
                </div>
            `).join('');
        }

        function remove(i) {
            carrito.splice(i, 1);
            document.getElementById('cart-count').innerText = carrito.length;
            renderCart();
        }

        function enviarWA() {
            const nombre = document.getElementById('cli-nombre').value;
            const dni = document.getElementById('cli-dni').value;
            const obs = document.getElementById('pedido-obs').value;

            if(!nombre) return alert("Completa el nombre del cliente");
            if(carrito.length === 0) return alert("El carrito está vacío");

            let texto = `*NUEVO PEDIDO BIO-FIX*\n`;
            texto += `--------------------------\n`;
            texto += `*Cliente:* ${nombre}\n`;
            texto += `*DNI/CUIT:* ${dni}\n`;
            
            if(document.querySelector('input[name="tipo_cliente"]:checked').value === 'nuevo') {
                texto += `*Localidad:* ${document.getElementById('cli-localidad').value}\n`;
                texto += `*Matrícula:* ${document.getElementById('cli-matricula').value}\n`;
            }

            texto += `\n*DETALLE:*\n`;
            carrito.forEach(i => {
                texto += `✅ ${i.cantidad} x ${i.nombre}\n`;
            });

            if(obs) texto += `\n*OBS:* ${obs}`;

            const url = `https://wa.me/5491122334455?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
