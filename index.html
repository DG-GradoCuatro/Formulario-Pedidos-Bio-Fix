<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Fix | Sistema Integral de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-cian { background-color: #00FFFF; color: #000; }
        .bg-rojo { background-color: #FF0000; color: #fff; }
        .bg-verde { background-color: #008000; color: #fff; }
        .bg-violeta { background-color: #8A2BE2; color: #fff; }
        .bg-gris { background-color: #808080; color: #fff; }
        .bg-fucsia { background-color: #FF00FF; color: #fff; }
        .bg-slate-600 { background-color: #475569; color: #fff; }
        .hidden { display: none; }
        .active-tab { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: 800; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <div class="max-w-xl mx-auto bg-white min-h-screen shadow-2xl flex flex-col">
        <header class="bg-slate-900 text-white p-5 text-center">
            <h1 class="text-2xl font-black tracking-tighter uppercase italic">BIO-FIX®</h1>
            <p class="text-[10px] text-blue-400 font-bold uppercase tracking-[0.3em]">Catálogo Profesional Completo</p>
        </header>

        <nav class="flex border-b sticky top-0 bg-white z-50 shadow-sm overflow-x-auto no-scrollbar">
            <button onclick="showSection('step-cliente')" id="nav-cliente" class="px-6 py-4 text-[10px] font-black active-tab uppercase whitespace-nowrap">1. Profesional</button>
            <button onclick="validateAndGo()" id="nav-productos" class="px-6 py-4 text-[10px] font-black uppercase whitespace-nowrap opacity-40">2. Catálogo</button>
            <button onclick="showSection('step-resumen')" id="nav-resumen" class="px-6 py-4 text-[10px] font-black uppercase whitespace-nowrap">3. Resumen (<span id="cart-count">0</span>)</button>
        </nav>

        <main class="p-4 flex-grow">
            <section id="step-cliente" class="space-y-4">
                <div class="bg-blue-50 p-5 rounded-xl border border-blue-100">
                    <h2 class="font-bold text-blue-900 mb-4 text-xs uppercase tracking-widest">Datos del Pedido</h2>
                    <input type="text" id="c_nom" placeholder="Nombre y Apellido *" class="w-full p-3 text-sm border rounded-lg outline-none focus:ring-2 ring-blue-500 mb-3">
                    <input type="text" id="c_dni" placeholder="DNI o CUIT *" class="w-full p-3 text-sm border rounded-lg outline-none focus:ring-2 ring-blue-500">
                </div>
                <button onclick="validateAndGo()" class="w-full bg-slate-800 text-white py-4 rounded-xl font-black text-sm uppercase">Entrar al Catálogo</button>
            </section>

            <section id="step-productos" class="hidden">
                <div class="flex overflow-x-auto gap-2 mb-6 pb-2 no-scrollbar">
                    <button onclick="renderCat('monopieza')" class="px-4 py-2 bg-cian text-black rounded-full text-[9px] font-black flex-shrink-0 border border-black">MP</button>
                    <button onclick="renderCat('basales')" class="px-4 py-2 bg-gris text-white rounded-full text-[9px] font-black flex-shrink-0">IB/IBT</button>
                    <button onclick="renderCat('compresivos')" class="px-4 py-2 bg-fucsia text-white rounded-full text-[9px] font-black flex-shrink-0">CMU/C3MU</button>
                    <button onclick="renderCat('hi')" class="px-4 py-2 bg-rojo text-white rounded-full text-[9px] font-black flex-shrink-0">HI</button>
                    <button onclick="renderCat('he')" class="px-4 py-2 bg-verde text-white rounded-full text-[9px] font-black flex-shrink-0">HE</button>
                    <button onclick="renderCat('cmhi')" class="px-4 py-2 bg-violeta text-white rounded-full text-[9px] font-black flex-shrink-0">CMHI</button>
                </div>
                <div id="catalog-container" class="space-y-4"></div>
            </section>

            <section id="step-resumen" class="hidden">
                <div id="cart-list" class="space-y-2 border-t pt-4"></div>
                <textarea id="obs" class="w-full border mt-4 p-4 rounded-xl h-24 text-sm" placeholder="Aclaraciones..."></textarea>
                <button onclick="sendWA()" class="w-full mt-6 bg-green-600 text-white py-5 rounded-2xl font-black uppercase">Enviar Pedido WhatsApp</button>
            </section>
        </main>
    </div>

                    "IBT Ø5.5x9mm","IBT Ø5.5x10mm","IBT Ø5.5x12mm","IBT Ø5.5x15mm","IBT Ø5.5x18mm","IBT Ø6.5x9mm","IBT Ø6.5x10mm","IBT Ø6.5x12mm","IBT Ø6.5x15mm","IBT Ø8.5x9mm","IBT Ø8.5x10mm","IBT Ø8.5x12mm","IBT Ø8.5x15mm"

        let cart = {};
        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'step-resumen') renderCart();
        }
        function validateAndGo() {
            if(!document.getElementById('c_nom').value) return alert("Ingrese Nombre");
            showSection('step-productos');
            renderCat('monopieza');
        }
        function renderCat(key) {
            const container = document.getElementById('catalog-container');
            container.innerHTML = "";
            for (const sub in DB[key]) {
                let div = `<div class="bg-white border rounded-xl mb-4 overflow-hidden shadow-sm">
                    <h3 class="p-2 text-center text-[10px] font-black uppercase ${'bg-'+DB[key][sub].col}">${sub}</h3>
                    <div class="divide-y">`;
                DB[key][sub].items.forEach(i => {
                    const q = cart[i] || 0;
                    div += `<div class="flex justify-between p-3 items-center hover:bg-gray-50">
                        <span class="text-[11px] font-bold text-gray-700">${i}</span>
                        <div class="flex items-center gap-2">
                            <button onclick="update('${i}',-1,'${key}')" class="w-7 h-7 border rounded bg-white font-bold">-</button>
                            <span class="text-xs font-black w-4 text-center">${q}</span>
                            <button onclick="update('${i}',1,'${key}')" class="w-7 h-7 bg-blue-600 text-white rounded font-bold">+</button>
                        </div>
                    </div>`;
                });
                container.innerHTML += div + `</div></div>`;
            }
        }
        function update(i,d,k) {
            cart[i] = (cart[i]||0)+d;
            if(cart[i]<=0) delete cart[i];
            document.getElementById('cart-count').innerText = Object.values(cart).reduce((a,b)=>a+b,0);
            renderCat(k);
        }
        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = "";
            const items = Object.entries(cart);
            if(items.length === 0) list.innerHTML = "<p class='text-center py-10 text-gray-400 text-xs uppercase'>El pedido está vacío</p>";
            items.forEach(([n,q]) => {
                list.innerHTML += `<div class="p-4 bg-gray-50 rounded-lg mb-2 flex justify-between items-center border border-gray-200">
                    <span class="text-xs font-bold text-gray-800"><b class="text-blue-600 mr-2">${q}x</b> ${n}</span>
                    <button onclick="update('${n}',-${q},'resumen'); renderCart();" class="text-red-500 font-bold text-[10px] uppercase">Eliminar</button>
                </div>`;
            });
        }
        function sendWA() {
            if(Object.keys(cart).length === 0) return alert("CARRITO VACÍO");
            let m = `*ORDEN DE PEDIDO BIO-FIX*\n*PROFESIONAL:* ${document.getElementById('c_nom').value.toUpperCase()}\n*DNI:* ${document.getElementById('c_dni').value}\n\n*DETALLE:*\n`;
            Object.entries(cart).forEach(([n,q])=> m+=`• ${q} x ${n}\n`);
            if(document.getElementById('obs').value) m+=`\n*NOTAS:* ${document.getElementById('obs').value}`;
            window.open(`https://wa.me/5491122334455?text=${encodeURIComponent(m)}`);
        }
    </script>
</body>
</html>
